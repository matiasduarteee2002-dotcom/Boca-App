<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boca">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Boca Juniors · Partidos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0B2A5B; --azul-2:#143C7D; --oro:#F2B705; --fondo:#F3F5F9; --tarjeta:#FFFFFF; --texto:#14213A; --suave:#5B6780; --linea:#DDE3EE;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fondo:#0A1428;--tarjeta:#122042;--texto:#EEF2FA;--suave:#9AA8C4;--linea:#243459}}
:root[data-theme="dark"]{--fondo:#0A1428;--tarjeta:#122042;--texto:#EEF2FA;--suave:#9AA8C4;--linea:#243459}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:'Barlow',system-ui,sans-serif;font-size:16px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto}
header{background:var(--azul);color:#fff;padding:20px 18px 0;border-bottom:6px solid var(--oro)}
h1{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:700;font-size:38px;line-height:1;margin:0 0 4px;letter-spacing:.5px}
.sub{color:#B9C8E8;margin:0 0 16px;font-size:14px}
nav{display:flex;gap:4px}
nav button{flex:1;background:transparent;border:0;color:#B9C8E8;font:600 18px 'Barlow Condensed',sans-serif;padding:12px 0;border-bottom:4px solid transparent;margin-bottom:-6px;cursor:pointer}
nav button.on{color:var(--oro);border-bottom-color:var(--oro)}
nav button:focus-visible,.partido:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
main{padding:18px}
.aviso{font-size:13px;color:var(--suave);margin:0 0 14px}
.proximo{background:var(--azul);color:#fff;border-radius:14px;padding:22px 18px;border-top:6px solid var(--oro)}
.proximo .torneo{color:var(--oro);font-weight:500;font-size:14px}
.proximo .vs{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;line-height:1.1;margin:8px 0}
.proximo .cuando{font-size:17px}
.partido{display:block;width:100%;text-align:left;background:var(--tarjeta);border:1px solid var(--linea);border-left:5px solid var(--azul-2);border-radius:10px;padding:14px;margin-bottom:10px;color:inherit;font:inherit;cursor:pointer}
.partido.g{border-left-color:var(--oro)}
.partido.p{border-left-color:#C0392B}
.fila{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fecha{color:var(--suave);font-size:13px}
.rival{font-weight:500}
.marcador{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;white-space:nowrap}
.detalle{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--linea);font-size:15px}
.partido.abierto .detalle{display:block}
.detalle p{margin:0 0 6px}
.detalle b{font-weight:500}
.vacio{color:var(--suave)}
.tag{display:inline-block;background:var(--oro);color:#14213A;font-weight:500;font-size:12px;padding:1px 8px;border-radius:99px;margin-right:6px;vertical-align:1px}
.tag.v{background:transparent;color:inherit;border:1px solid currentColor}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chips button{flex:none;background:var(--tarjeta);color:var(--texto);border:1px solid var(--linea);border-radius:99px;padding:8px 14px;font:500 15px 'Barlow',sans-serif;cursor:pointer}
.chips button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.tabla{width:100%;border-collapse:collapse;background:var(--tarjeta);border:1px solid var(--linea);border-radius:10px;overflow:hidden}
.tabla th{font-weight:500;color:var(--suave);font-size:13px;text-align:right;padding:10px}
.tabla td{padding:10px;text-align:right;border-top:1px solid var(--linea)}
.tabla th:nth-child(1),.tabla td:nth-child(1){text-align:left;width:34px;color:var(--suave)}
.tabla th:nth-child(2),.tabla td:nth-child(2){text-align:left}
.tabla tr.boca td{background:var(--azul);color:#fff;font-weight:500}
.tabla tr.boca td:first-child{color:var(--oro)}
.tabla tr.z-oct td:first-child{box-shadow:inset 5px 0 0 #4DA3FF}
.tabla tr.z-cam td:first-child{box-shadow:inset 5px 0 0 #7ED957}
.tabla tr.z-lib td:first-child{box-shadow:inset 5px 0 0 #F2C94C}
.tabla tr.z-sud td:first-child{box-shadow:inset 5px 0 0 #5EE0E0}
.tabla tr.z-des td:first-child{box-shadow:inset 5px 0 0 #E5484D}
.leyenda{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:13px;color:var(--suave)}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.llave{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.ronda{flex:none;width:200px;display:flex;flex-direction:column}
.ronda h3{font:600 16px 'Barlow Condensed',sans-serif;color:var(--suave);margin:0 0 8px}
.cruces{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:10px}
.cruce{background:var(--tarjeta);border:1px solid var(--linea);border-radius:8px;overflow:hidden;font-size:14px}
.eq{display:flex;justify-content:space-between;gap:8px;padding:7px 10px}
.eq+.eq{border-top:1px solid var(--linea)}
.eq.gana{font-weight:500}
.eq.perd{color:var(--suave)}
.eq.boca{background:var(--azul);color:#fff;font-weight:500}
.det{font-size:11px;color:var(--suave);padding:4px 10px;border-top:1px solid var(--linea)}
h2{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:20px;margin:22px 0 10px;color:var(--suave)}
.siguiente{background:var(--tarjeta);border:1px solid var(--linea);border-left:5px solid var(--oro);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.siguiente .rival{font-size:17px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>BOCA JUNIORS</h1>
  <p class="sub">Partidos, resultados y goleadores</p>
  <nav>
    <button id="t-prox" class="on">Próximo</button>
    <button id="t-res">Resultados</button>
    <button id="t-tab">Tablas</button>
  </nav>
</header>
<main>
  <p class="aviso">Datos cargados a mano el 3 de octubre de 2026, según la prensa deportiva. Pueden quedar desactualizados.</p>
  <section id="vista"></section>
</main>
</div>

<script>
// 1) LOS DATOS: cargados a mano el 3 de octubre de 2026. Para actualizar la app, editas estas listas.
const proximo = {
  torneo: "Liga Profesional · Clausura, fecha 12",
  rival: "Instituto", local: false,
  fecha: "Viernes 9 de octubre", hora: "19:30"
};

const siguientes = [
  { mes: "Octubre", torneo: "Copa Sudamericana · semifinal (ida)", rival: "Vasco da Gama", local: true,  fecha: "Martes 13 de octubre", hora: "21:30" },
  { mes: "Octubre", torneo: "Liga Profesional · Clausura, fecha 13", rival: "Talleres", local: true,  fecha: "Fin de semana del 18 de octubre", hora: "día y hora a definir" },
  { mes: "Octubre", torneo: "Copa Sudamericana · semifinal (vuelta)", rival: "Vasco da Gama", local: false, fecha: "Martes 20 de octubre", hora: "21:30" },
  { mes: "Octubre", torneo: "Liga Profesional · Clausura, fecha 14", rival: "Independiente", local: false, fecha: "Fin de semana del 25 de octubre", hora: "día y hora a definir" },
  { mes: "Noviembre", torneo: "Liga Profesional · Clausura, fecha 15", rival: "River", local: true, fecha: "Fin de semana del 1 de noviembre", hora: "día y hora a definir" },
  { mes: "Noviembre", torneo: "Liga Profesional · Clausura, fecha 16", rival: "Defensa y Justicia", local: true, fecha: "Fin de semana del 8 de noviembre", hora: "día y hora a definir" },
  { mes: "Noviembre", torneo: "Copa Argentina · semifinal", rival: "Banfield", local: null, fecha: "Sábado 14 de noviembre", hora: "sede y horario a definir" },
  { mes: "Noviembre", torneo: "Copa Sudamericana · final, en Barranquilla", rival: "A definir", local: null, fecha: "Sábado 21 de noviembre", hora: "horario a definir", cond: true },
  { mes: "Diciembre", torneo: "Copa Argentina · final", rival: "A definir", local: null, fecha: "Miércoles 2 de diciembre", hora: "estadio y horario a definir", cond: true }
];

// local: true = en La Bombonera, false = de visitante, null = cancha neutral
// goles: null = todavía no cargamos los goleadores
const jugados = [
  { fecha: "2 oct", torneo: "Liga Profesional · Clausura, fecha 11", rival: "Unión", local: true, gb: 3, gr: 0,
    goles: ["Di Lollo 22'", "Flores 83'", "Flores 90+2'"], rivalGoles: [] },
  { fecha: "27 sep", torneo: "Copa Argentina · cuartos", rival: "Racing", local: null, gb: 3, gr: 2,
    goles: ["Enner Valencia 72'", "Enner Valencia 80'", "Enner Valencia 90+5'"],
    rivalGoles: ["Gastón Lodico 19'", "Adrián Martínez 47'"] },
  { fecha: "20 sep", torneo: "Liga Profesional · Clausura, fecha 10", rival: "San Lorenzo", local: false, gb: 2, gr: 0,
    goles: ["Leandro Lozano", "Miguel Merentiel"], rivalGoles: [] },
  { fecha: "Fecha 9", torneo: "Liga Profesional · Clausura", rival: "Central Córdoba", local: true, gb: 3, gr: 1,
    goles: ["Romero 5'", "Valencia 11'", "Romero 56'"], rivalGoles: ["Cuitiño 90'"] }
];

// Un cruce de copa: equipo a, equipo b, resultados, quién ganó ("a" o "b") y un detalle.
const c = (a, b, ra, rb, g, det) => ({ a, b, ra, rb, g, det });

// Tablas: cada una tiene filas [equipo, partidos jugados, puntos] o, si no hay tabla, un texto.
const tablas = {
  "Clausura Zona A": {
    nota: "Estado al 3 de octubre.",
    zona: (i) => i < 8 ? "z-oct" : "",
    leyenda: [["#4DA3FF", "Octavos de final (los 8 primeros de cada zona)"]],
    filas: [["Instituto",11,25],["Boca",11,20],["Vélez",10,20],["Defensa y Justicia",10,18],["Gimnasia (M)",10,17],
            ["Independiente",11,17],["Lanús",10,16],["Newell's",10,16],["Unión",11,13],["San Lorenzo",10,11],
            ["Estudiantes",10,10],["Riestra",10,10],["Platense",10,9],["Talleres",10,8],["Central Córdoba",10,8]]
  },
  "Tabla anual": {
    nota: "Estado al 3 de octubre.",
    zona: (i) => i === 0 ? "z-cam" : i < 3 ? "z-lib" : i < 9 ? "z-sud" : i === 29 ? "z-des" : "",
    leyenda: [["#7ED957", "Campeón de Liga: Libertadores 2027 y Supercopa"], ["#F2C94C", "Copa Libertadores"], ["#5EE0E0", "Copa Sudamericana"], ["#E5484D", "Descenso"]],
    filas: [["Independiente Rivadavia",27,52],["Boca",27,50],["Vélez",26,48],["Argentinos",26,47],["Instituto",27,46],
            ["Rosario Central",26,46],["Gimnasia (LP)",27,44],["River",26,42],["Belgrano",26,42],["Estudiantes (LP)",26,41],
            ["Independiente",27,41],["Lanús",26,40],["Huracán",26,38],["Defensa y Justicia",26,37],["Gimnasia (M)",26,36],
            ["Sarmiento",26,35],["Unión",27,34],["Talleres",26,34],["Barracas Central",26,33],["San Lorenzo",26,33],
            ["Tigre",26,32],["Newell's",26,31],["Racing",26,29],["Atlético Tucumán",26,27],["Banfield",26,27],
            ["Platense",26,25],["Central Córdoba",26,24],["Riestra",26,21],["Aldosivi",26,16],["Estudiantes (RC)",26,11]]
  },
  "Copa Argentina": { pie: "Cada ronda se juega en un solo partido, con penales si hay empate.", rondas: [
    { nombre: "Cuartos", cruces: [
      c("Banfield","Riestra","1 (7)","1 (6)","a","Penales 7-6"),
      c("Racing","Boca","2","3","b",""),
      c("Atl. Tucumán","Ind. Rivadavia","1 (3)","1 (2)","a","Penales 3-2"),
      c("Platense","Estudiantes (LP)","1","0","a","") ] },
    { nombre: "Semifinales", cruces: [
      c("Banfield","Boca","","","","Sáb 14 nov"),
      c("Atl. Tucumán","Platense","","","","Mié 28 oct") ] },
    { nombre: "Final", cruces: [ c("A definir","A definir","","","","Mié 2 dic") ] } ] },
  "Libertadores": { pie: "Boca no llegó a los octavos de final: ahora juega la Sudamericana. La final es el 28 de noviembre en Montevideo.", rondas: [
    { nombre: "Cuartos", cruces: [
      c("Estudiantes (LP)","Corinthians","2","1","a","Ida 1-1 · vuelta 1-0"),
      c("Ind. del Valle","Flamengo","1","3","b","Ida 0-2 · vuelta 1-1"),
      c("Platense","Fluminense","2","3","b","Ida 0-2 · vuelta 2-1"),
      c("Liga de Quito","Palmeiras","3 (3)","3 (4)","b","Ida 0-1 · vuelta 3-2") ] },
    { nombre: "Semifinales", cruces: [
      c("Estudiantes (LP)","Flamengo","","","","Octubre"),
      c("Fluminense","Palmeiras","","","","Octubre") ] },
    { nombre: "Final", cruces: [ c("A definir","A definir","","","","28 nov · Montevideo") ] } ] },
  "Sudamericana": { pie: "Ida y vuelta, con resultado global. En la semifinal, Boca juega la ida en La Bombonera.", rondas: [
    { nombre: "Cuartos", cruces: [
      c("Boca","São Paulo","2","1","a","Ida 1-0 · vuelta 1-1"),
      c("Vasco da Gama","Santa Fe","2","0","a","Ida 0-0 · vuelta 2-0"),
      c("Atl. Mineiro","Santos","4 (3)","4 (1)","a","Ida 0-2 · vuelta 4-2"),
      c("Montevideo City","Cienciano","3","2","a","Ida 0-2 · vuelta 3-0") ] },
    { nombre: "Semifinales", cruces: [
      c("Vasco da Gama","Boca","","","","Ida 13 oct · vuelta 20 oct"),
      c("Atl. Mineiro","Montevideo City","","","","Fechas a definir") ] },
    { nombre: "Final", cruces: [ c("A definir","A definir","","","","21 nov · Barranquilla") ] } ] }
};
let tablaActual = "Clausura Zona A";

// 2) LAS FUNCIONES: cada una dibuja una pantalla a partir de los datos.
const vista = document.getElementById("vista");

function etiqueta(local) {
  if (local === true) return '<span class="tag">Local</span>';
  if (local === false) return '<span class="tag v">Visitante</span>';
  return '<span class="tag v">Cancha neutral</span>';
}
const titulo = (p) => p.rival === "A definir" ? "Boca vs rival a definir" : p.local === true ? "Boca vs " + p.rival : p.rival + " vs Boca";

function mostrarProximo() {
  let mes = "";
  const calendario = siguientes.map(s => {
    const encabezado = s.mes !== mes ? `<h2>${s.mes}</h2>` : "";
    mes = s.mes;
    return encabezado + `
    <div class="siguiente">
      <div class="fecha">${etiqueta(s.local)}${s.cond ? '<span class="tag v">Si avanza</span>' : ""}${s.torneo}</div>
      <div class="rival">${titulo(s)}</div>
      <div class="fecha">${s.fecha} · ${s.hora}</div>
    </div>`;
  }).join("");
  vista.innerHTML = `
    <div class="proximo">
      <div class="torneo">${etiqueta(proximo.local)}${proximo.torneo}</div>
      <div class="vs">${titulo(proximo)}</div>
      <div class="cuando">${proximo.fecha} · ${proximo.hora}</div>
    </div>` + calendario;
}

function mostrarResultados() {
  const lista = (arr) => arr === null ? "sin cargar" : arr.length ? arr.join(", ") : "—";
  vista.innerHTML = jugados.map(m => {
    const clase = m.gb > m.gr ? "g" : m.gb < m.gr ? "p" : "";
    return `
    <button class="partido ${clase}" aria-expanded="false">
      <div class="fila">
        <div>
          <div class="fecha">${etiqueta(m.local)}${m.fecha} · ${m.torneo}</div>
          <div class="rival">${titulo(m)}</div>
        </div>
        <div class="marcador">${m.gb} - ${m.gr}</div>
      </div>
      <div class="detalle">
        <p><b>Goles de Boca:</b> ${lista(m.goles)}</p>
        <p><b>Goles de ${m.rival}:</b> ${lista(m.rivalGoles)}</p>
      </div>
    </button>`;
  }).join("");
}

function cruceHTML(x) {
  const fila = (n, r, lado) => {
    const clase = n === "Boca" ? "boca" : !x.g ? "" : x.g === lado ? "gana" : "perd";
    return `<div class="eq ${clase}"><span>${n}</span><span>${r}</span></div>`;
  };
  return `<div class="cruce">${fila(x.a, x.ra, "a")}${fila(x.b, x.rb, "b")}<div class="det">${x.det || "&nbsp;"}</div></div>`;
}

function mostrarTablas() {
  const chips = Object.keys(tablas).map(n =>
    `<button data-t="${n}" class="${n === tablaActual ? "on" : ""}">${n}</button>`).join("");
  const t = tablas[tablaActual];
  let cuerpo;
  if (t.rondas) {
    cuerpo = `<div class="llave">${t.rondas.map(r => `
      <div class="ronda"><h3>${r.nombre}</h3><div class="cruces">${r.cruces.map(cruceHTML).join("")}</div></div>`).join("")}</div>
      <p class="aviso" style="margin-top:10px">${t.pie}</p>`;
  } else {
    const filas = t.filas.map((f, i) => `
      <tr class="${f[0] === "Boca" ? "boca " : ""}${t.zona ? t.zona(i) : ""}"><td>${i + 1}</td><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td></tr>`).join("");
    cuerpo = `<table class="tabla"><tr><th>#</th><th>Equipo</th><th>PJ</th><th>Pts</th></tr>${filas}</table>
      <div class="leyenda">${t.leyenda.map(l => `<span><i style="background:${l[0]}"></i>${l[1]}</span>`).join("")}</div>
      <p class="aviso" style="margin-top:10px">${t.nota}</p>`;
  }
  vista.innerHTML = `<div class="chips">${chips}</div>${cuerpo}`;
}

// 3) LOS EVENTOS: qué pasa cuando tocas algo.
vista.addEventListener("click", (e) => {
  const chip = e.target.closest(".chips button");
  if (chip) { tablaActual = chip.dataset.t; mostrarTablas(); return; }
  const tarjeta = e.target.closest(".partido");
  if (!tarjeta) return;
  const abierto = tarjeta.classList.toggle("abierto");
  tarjeta.setAttribute("aria-expanded", abierto);
});

const pestañas = [["t-prox", mostrarProximo], ["t-res", mostrarResultados], ["t-tab", mostrarTablas]];
pestañas.forEach(([id, mostrar]) => {
  document.getElementById(id).onclick = () => {
    pestañas.forEach(([otro]) => document.getElementById(otro).className = "");
    document.getElementById(id).className = "on";
    mostrar();
  };
});

mostrarProximo();
</script>
</body>
</html>
